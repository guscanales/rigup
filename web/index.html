<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0b0d">
<title>GPU Switchboard</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,300;0,400;0,500;0,600;1,300&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="grain" aria-hidden="true"></div>
<div id="cursorGlow" aria-hidden="true"></div>

<div class="shell">
  <nav class="nav">
    <span class="brand">
      <span class="brand-mark" aria-hidden="true"><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i></span>
      <span class="brand-wordmark">GPU <span class="brand-tld">Switchboard</span></span>
      <span class="mono dim brand-sub" id="host"></span>
    </span>
    <div class="tiers" role="tablist" id="tiers"></div>
    <div class="nav-right"><span class="mono" id="clock">--:--</span></div>
  </nav>

  <section class="view scroll" id="view-gpu">
    <div class="gpu-head">
      <div>
        <h1 class="section-title" id="g-title">Connecting…</h1>
        <div id="g-lede"></div>
      </div>
      <div class="meters" id="meters"></div>
    </div>
    <div class="gpu-cols">
      <div class="gpu-col">
        <div class="mode lab" id="lab"></div>
        <div class="panel">
          <div class="panel-head"><span class="mono">Console</span><span class="mono dim" id="g-state"></span></div>
          <pre class="console" id="g-log">Nothing yet.</pre>
        </div>
      </div>
      <div class="gpu-col">
        <div class="mode lab comfy" id="comfy"></div>
        <div class="panel">
          <div class="panel-head"><span class="mono">Open</span><span class="mono dim">ports on this server</span></div>
          <div id="g-links"></div>
          <form class="token" id="token">
            <label class="mono" for="tok">Hugging Face token</label>
            <input id="tok" type="password" autocomplete="off" placeholder="hf_…">
            <button class="link-act" type="submit">Save</button>
            <span class="mono dim" id="tok-state"></span>
          </form>
        </div>
      </div>
    </div>
  </section>
</div>

<script src="app.js"></script>
</body>
</html>
